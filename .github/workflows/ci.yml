# CI : à chaque push ou pull request sur master, on vérifie le code, on lance les tests et on construit l'app.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verifications:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm # garde les dépendances en cache

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier la qualité du code
        run: npm run lint

      - name: Vérifier les types
        run: npm run typecheck

      - name: Lancer les tests avec la couverture
        run: npm run test:coverage

      - name: Construire l'app
        run: npm run build

      - name: Garder le rapport de couverture
        if: always() # même si un test échoue
        uses: actions/upload-artifact@v6
        with:
          name: rapport-couverture
          path: coverage/
          retention-days: 14